name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: workstation-setup-linux-x86_64
            built_name: workstation-setup
          - os: macos-latest
            artifact_name: workstation-setup-macos-arm64
            built_name: workstation-setup
          - os: windows-latest
            artifact_name: workstation-setup-windows-x86_64.exe
            built_name: workstation-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Build standalone executable
        run: pyinstaller packaging/pyinstaller.spec

      - name: Smoke-test standalone executable
        run: python -c "import subprocess; subprocess.run(['dist/${{ matrix.built_name }}', '--version'], check=True)"

      - name: Rename artifact
        run: python -c "from pathlib import Path; Path('dist/${{ matrix.built_name }}').replace('dist/${{ matrix.artifact_name }}')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/workstation-setup-*
